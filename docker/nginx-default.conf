# serve HTML by default, Turtle or JSON-LD when requested through the Accept header
map $http_accept $rdf_ext {
    default                     "html";
    "~*text/turtle"             "ttl";
    "~*application/ld\+json"    "jsonld";
}

server {
    listen       80;
    server_name  id.openzim.org localhost;
    root   /usr/share/nginx/html;
    absolute_redirect off;

    types {
        text/html            html;
        text/turtle          ttl;
        application/ld+json  jsonld;
    }
    charset utf-8;
    charset_types text/html text/turtle application/ld+json;

    gzip on;
    gzip_proxied any;
    gzip_types text/turtle application/ld+json;

    add_header Vary Accept always;
    add_header Access-Control-Allow-Origin * always;

    location = / {
        return 302 /categories/;
    }

    # /categories/<id> and /categories/<id>/ both serve /categories/<id>/index.<ext>
    location ~ ^(?<base>/.+?)/?$ {
        try_files $base/index.$rdf_ext $uri =404;
    }
}
