name: Publish

on:
  push:
    branches:
      - main
    paths:
      - "categories/**"
      - "docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/Publish.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish id.openzim.org image
    runs-on: ubuntu-24.04

    steps:
      - name: Retrieve source code
        uses: actions/checkout@v5

      - name: Build and publish Docker image
        uses: openzim/docker-publish-action@v10
        with:
          image-name: openzim/id
          on-master: latest
          restrict-to: openzim/content-classification-system
          registries: ghcr.io
          credentials: GHCRIO_USERNAME=${{ secrets.GHCR_USERNAME }}
            GHCRIO_TOKEN=${{ secrets.GHCR_TOKEN }}
